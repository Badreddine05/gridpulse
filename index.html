<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#fbfaf6"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#121211"
      media="(prefers-color-scheme: dark)"
    />
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem("bc-theme");
        } catch (error) {}
        var metas = document.querySelectorAll('meta[name="theme-color"]');
        var color = null;
        for (var i = 0; i < metas.length; i++) {
          var content = metas[i].getAttribute("content");
          metas[i].setAttribute("data-default", content);
          if ((metas[i].getAttribute("media") || "").indexOf(theme) > -1) {
            color = content;
          }
        }
        if (theme !== "light" && theme !== "dark") return;
        document.documentElement.setAttribute("data-theme", theme);
        for (var j = 0; j < metas.length; j++) {
          if (color) metas[j].setAttribute("content", color);
        }
      })();
    </script>
    <meta
      name="description"
      content="Consommation et production d'électricité en France, 2023–2024, d'après les données publiques RTE éCO2mix, avec une prévision à 24 heures évaluée sur novembre et décembre 2024."
    />
    <title>GridPulse · électricité française 2023–2024</title>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
